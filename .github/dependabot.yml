version: 2
updates:
  - package-ecosystem: bundler
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    # ⚠ ginseng-* は version update から外す（#139）。固定した版をいつ・どこまで上げるかは
    # 人が決めていて、Dependabot の PR はその判断を持てない（遅れる・無関係なメジャー更新を
    # 連れてくる・SHA 固定の ginseng-style はそもそも追えない）。ずれはセッション同期で拾う
    # （docs/CLAUDE.md の「進捗の同期手順」6）。
    # ⚠⚠ 止め方は ignore。allow で絞ると security update まで止まるので使わない。
    # ⚠⚠ **update-types は付けない。**付けた形（#182）は git 参照の ginseng-core に効かず、
    # version update の PR が来た（#197 → #198）。名前だけの ignore は security update にも
    # 効くが、ginseng-* はどちらも rubygems に無く（アドバイザリが付く経路が無い）、
    # もともと security update は来ない。
    ignore:
      - dependency-name: 'ginseng-*'
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
