name: test
on:
  - push
# ⚠⚠ 手順の本体は pooza/ginseng-style の composite action を参照している。
# そこに入った変更がこのリポジトリの GITHUB_TOKEN を持って動くので、既定に頼らず絞る。
permissions:
  contents: read
env:
  CI: 'true'
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ⚠⚠ OS 標準の Ruby で動かすので、実機の system ruby の系列を全部並べる。
        # 3.3 = Ubuntu、3.4 = FreeBSD（pkg。chubo2 の ruby.system.version）。
        # 実機の版と食い違うと、CI が緑のまま実機で落ちる（2026-07-18 に pkg から
        # ruby33 が消え、FreeBSD 機の自動ダンプが 2 か月止まった）。
        ruby: ['3.3', '3.4']
    steps:
      - uses: actions/checkout@v5
        with:
          # ⚠ 既定では認証情報がワークツリーの git config に残り、後続のステップから
          # 使えてしまう。依存 gem は public な github: 参照なので消して困らない。
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          # ⚠ matrix の最小を .rubocop.yml の TargetRubyVersion と揃えること
          # （docs/CLAUDE.md）。最小を上げるときは両方を同時に上げる。
          ruby-version: ${{ matrix.ruby }}
      - name: apt install
        run: |
          sudo apt update
          sudo apt install libsqlite3-dev
      # ⚠ 手順の正本は composite action 側。参照は SHA で固定し、Gemfile の
      # ginseng-style と同じ版に揃える（#70 と同じ理由 ＝ タグは付け替えられる）。
      - uses: pooza/ginseng-style/.github/actions/ruby-check@ed862dcf9550d704ee670f65a30a333a694b883a # v1.1.12
        with:
          # ⚠⚠ CI で bundle update すると、Gemfile.lock が CI の結果を縛らなくなる。
          # こちらが 1 行も変えていない日に、依存の新版で赤くなる。依存の更新は
          # Dependabot が PR で持ってくるので、CI は lock のとおりに組む。
          bundle-update: 'false'
          bundle-check: 'false'
