crypt:
  encoder: base64
  password: null
environment: development
http:
  retry:
    limit: 3
    seconds: 1
logger:
  # ⚠ Ginseng::Masking の既定と**合成**される（減らす方向へは効かない）。
  # 伏せた値はキーごと落ちる（`***` への置換ではない）。
  mask_fields:
    - MYSQL_PWD
    - PGPASSWORD
  # ⚠ URL の**パス**に埋まった資格情報。モロヘイヤの webhook URL は
  # クエリではなくパスにダイジェストが載る（#65）。既定は
  # `/mulukhiya/webhook/` だけなので、素の `/webhook/` も足す。
  mask_url_paths:
    - /webhook/
package:
  authors:
    - Tatsuya Koishi
  description: VPS上で実行する雑多なユーティリティ。
  email:
    - tkoishi@b-shock.co.jp
  license: MIT
  url: https://github.com/THE-POWERNEWS/writersbase-tools
  version: 1.6.0
ruby:
  bin: /usr/bin/ruby3.3
sentry:
  # ⚠ 空なら Sentry は初期化されず、何も送らない。サーバでは config/local.yaml に書く。
  # ⚠ DSN は秘密ではない（送信専用・公開情報）。
  dsn: null
  # 省略時は /environment の値を使う
  environment: null
  traces_sample_rate: 0
  # ⚠ `\K` で**値だけ**を伏せる。キー名は残さないと、何が伏せられたのか分からない。
  # 1つ目は URL の userinfo（`postgres://user:pass@host`）。
  # ⚠ ginseng-core を上げれば Ginseng::Masking が同じ役を果たすが、
  #   固定している版にはまだ無いので、ここでも拾う。
  scrub_patterns:
    - '(?i)\b[a-z][a-z0-9+.-]*://[^\s:/@]+:\K[^\s@]+(?=@)'
    - '(?i)\b(?:MYSQL_PWD|PGPASSWORD)=\K\S+'
    - '(?i)\b(?:token|auth_token|auth_key|access_token|refresh_token|password|secret|api_key)=\K\S+'
    # ⚠ モロヘイヤの webhook URL は**パス**にダイジェストが載るので、URL のクエリを
    # 見るマスクでは伏せられない。`--webhook <url>` の形で拾う（#65）。
    # ⚠ CommandLine#secrets 側で伏せるのが本線で、これはその漏れに対する保険。
    - '(?i)--webhook[=\s]+\K\S+'
hourly: []
daily: []
weekly: []
monthly: []
zstd:
  level: 3
access_log_compress:
  dir: /var/log/nginx
  days: 1
mysql_dump:
  host: 127.0.0.1
  user: root
  password: null
  databases: []
  port: 3306
  days: 7
  dest:
    dir: /var/backups/db
postgresql_dump:
  host: localhost
  user: postgres
  password: null
  databases: []
  port: 5432
  days: 7
  dest:
    dir: /var/backups/db
mysql_snapshot:
  target: zroot/mysql
  days: 3
  host: 127.0.0.1
  user: root
  password: null
  port: 3306
postgresql_snapshot:
  target: zroot/postgres
  days: 3
  dsn: postgres://postgres@localhost/mastodon
mastodon:
  user: mastodon
  rails_env: production
  dir: /home/mastodon/repos/mastodon
service_restart:
  services: []
mastodon_maintenance:
  commands:
    - cache recount accounts
    - accounts cull
mastodon_follow:
  account: info
mastodon_media_cleanup:
  commands:
    - media remove-orphans
    - media remove --remove-headers
    - preview_cards remove -c 1
misskey_emoji_sync:
  origin: null
  webhook: null
rsync_backup:
  dest: user@host:/path/to/backup
  sources:
    - /etc
    - /usr/local/etc
  excludes:
    - .git
    - .zfs
    - .cache
    - node_modules
    - vendor/bundle
    - tmp
    - '*.bak'
    - '*.log'
    - '*.swp'
    - '*.tmp'
google_drive_backup:
  remote: gdrive
  path: /backup
  sources:
    - /etc
    - /usr/local/etc
  excludes:
    - .git
    - .zfs
    - .cache
    - node_modules
    - vendor/bundle
    - tmp
    - '*.bak'
    - '*.log'
    - '*.swp'
    - '*.tmp'
