crypt:
  encoder: base64
  password: null
environment: development
http:
  retry:
    limit: 3
    seconds: 1
  # ⚠⚠ **`Ginseng::HTTP#initialize` が無条件に読む**ので、欠けていると
  # `HTTP.new` の時点で ConfigError になる（#121 で `Heartbeat` が初めて使って発覚）。
  timeout:
    seconds: 20
# 実行結果を Uptime Kuma の push モニタへ送る（#91）。
# 🔴 **成功時も送る。**push モニタは「ハートビートが途切れたら DOWN」という向きなので、
# **そもそも走らなかった**（宣言漏れ・ノード停止）も拾える。
# ⚠⚠ **トークンはそれ自体が資格情報**なので、既定は空。サーバの local.yaml に書く。
heartbeat:
  base: https://uptime.b-shock.org/api/push
  timeout: 20
  # ⚠ ツール名をキーに push トークンを書く。**書いたツールだけ**送る
  tokens: {}
logger:
  # ⚠ Ginseng::Masking の既定と**合成**される（減らす方向へは効かない）。
  # 伏せた値はキーごと落ちる（`***` への置換ではない）。
  mask_fields:
    - MYSQL_PWD
    - PGPASSWORD
  # ⚠ URL の**パス**に埋まった資格情報。モロヘイヤの webhook URL は
  # クエリではなくパスにダイジェストが載る（#65）。既定は
  # `/mulukhiya/webhook/` だけなので、素の `/webhook/` も足す。
  mask_url_paths:
    - /webhook/
    # ⚠ Uptime Kuma の push URL もパスにトークンが載る（#91）。
    # `Ginseng::HTTP#log` が `url:` を出すので、ここで伏せる（#121）。
    - /api/push/
package:
  authors:
    - Tatsuya Koishi
  description: VPS上で実行する雑多なユーティリティ。
  email:
    - tkoishi@b-shock.co.jp
  license: MIT
  url: https://github.com/THE-POWERNEWS/writersbase-tools
  version: 1.8.0
reboot_required:
  # ⚠ 稼働日数がこれ以上で、かつ再起動待ちなら heartbeat を down にする（#141）。
  # chubo-core の monit（`monit.reboot_stale_days`）と揃えてある
  stale_days: 42
ruby:
  bin: /usr/bin/ruby3.3
sentry:
  # ⚠ 空なら Sentry は初期化されず、何も送らない。サーバでは local.yaml に書く
  # （FreeBSD は /usr/local/etc/writersbase-tools/・Ubuntu は /etc/writersbase-tools/）。
  # ⚠ DSN は秘密ではない（送信専用・公開情報）。
  dsn: null
  # 省略時は /environment の値を使う
  environment: null
  traces_sample_rate: 0
  # ⚠ `\K` で**値だけ**を伏せる。キー名は残さないと、何が伏せられたのか分からない。
  # 1つ目は URL の userinfo（`postgres://user:pass@host`）。
  # ⚠ ginseng-core を上げれば Ginseng::Masking が同じ役を果たすが、
  #   固定している版にはまだ無いので、ここでも拾う。
  scrub_patterns:
    - '(?i)\b[a-z][a-z0-9+.-]*://[^\s:/@]+:\K[^\s@]+(?=@)'
    - '(?i)\b(?:MYSQL_PWD|PGPASSWORD)=\K\S+'
    - '(?i)\b(?:token|auth_token|auth_key|access_token|refresh_token|password|secret|api_key)=\K\S+'
    # ⚠ モロヘイヤの webhook URL は**パス**にダイジェストが載るので、URL のクエリを
    # 見るマスクでは伏せられない。`--webhook <url>` の形で拾う（#65）。
    # ⚠ CommandLine#secrets 側で伏せるのが本線で、これはその漏れに対する保険。
    - '(?i)--webhook[=\s]+\K\S+'
hourly: []
daily: []
weekly: []
monthly: []
zstd:
  level: 3
access_log_compress:
  dir: /var/log/nginx
  days: 1
  # ⚠⚠ ローテート済みと分かる名前（rsyslog が日付で書く access_YYYYMMDD.log）だけに当てる。
  # `*.log` では nginx が開いたままの error.log / access.log にも当たり、`zstd --rm` で消す（#123）
  patterns:
    - 'access_[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9].log'
mysql_dump:
  host: 127.0.0.1
  user: root
  password: null
  databases: []
  port: 3306
  # ⚠ InnoDB を MVCC で一貫して読む。`--lock-tables`（mysqldump の既定）が
  # 自動的に無効になるので、**ダンプ中も書き込みが止まらない**（#79）。
  # 🔴 **MyISAM のテーブルには何の保護も無くなる。**混ざっている DB では
  # false にして `--lock-tables` に戻すこと。
  single_transaction: true
  days: 7
  dest:
    dir: /var/backups/db
postgresql_dump:
  host: localhost
  user: postgres
  password: null
  databases: []
  port: 5432
  days: 7
  dest:
    dir: /var/backups/db
mysql_snapshot:
  # ⚠⚠ **ノードごとに必ず設定する。**ZFS のデータセット名は環境ごとに違う。
  # 未設定なら ConfigError で落ちる（存在しないデータセットを指して
  # 「掃除も作成も静かに空振り」を避けるため・#67）。
  target: null
  days: 3
  host: 127.0.0.1
  user: root
  password: null
  port: 3306
postgresql_snapshot:
  # ⚠⚠ **ノードごとに必ず設定する。**未設定なら ConfigError で落ちる（#67）。
  target: null
  days: 3
  # ⚠⚠ **ノードごとに必ず設定する。**未設定なら ConfigError で落ちる（#87）。
  # 以前は `postgres://postgres@localhost/mastodon` を既定に置いていたが、
  # **DB 名まで埋まっている**ため、Mastodon 以外のノードへ写すと
  # 存在しない DB に繋ぎ続ける。
  dsn: null
mastodon:
  user: mastodon
  rails_env: production
  dir: /home/mastodon/repos/mastodon
service_restart:
  services: []
mastodon_maintenance:
  commands:
    - cache recount accounts
    - accounts cull
mastodon_follow:
  account: info
mastodon_media_cleanup:
  commands:
    - media remove-orphans
    - media remove --remove-headers
    - preview_cards remove -c 1
misskey_emoji_sync:
  origin: null
  webhook: null
rsync_backup:
  # ⚠⚠ **ダミーの既定を置かない。**`rsync --delete` を使う道具なので、
  # それらしい既定のまま daily に載ると意味不明な失敗になる（#67）。
  dest: null
  sources:
    - /etc
    - /usr/local/etc
  excludes:
    - .git
    - .zfs
    - .cache
    - node_modules
    - vendor/bundle
    - tmp
    - '*.bak'
    - '*.log'
    - '*.swp'
    - '*.tmp'
google_drive_backup:
  remote: gdrive
  # ⚠⚠ **ノードごとに必ず設定する。**未設定なら ConfigError で落ちる（#120）。
  # 以前は `/backup` を既定に置いていたが、**ホスト名を含まない**ため、
  # 宣言を書き忘れたノードが先に置いた別ノードのバックアップを
  # `rclone sync` で消す形になっていた。⚠ `/backup/<FQDN>` のように書くこと。
  path: null
  # ⚠⚠ シンボリックリンクを `<名前>.rclonelink` として保存する（#97）。
  # 🔴 渡さないと rclone はリンクを落とす。**しかも exit 0 で終わる**ので気づけない
  # （1.60 / 1.75 とも同じ挙動であることを 2026-09-18 に実測）。
  # ⚠ 宛先に `.rclonelink` が生えるので、false へ倒すと次の sync がそれを消す。
  links: true
  sources:
    - /etc
    - /usr/local/etc
  excludes:
    - .git
    - .zfs
    - .cache
    - node_modules
    - vendor/bundle
    - tmp
    - '*.bak'
    - '*.log'
    - '*.swp'
    - '*.tmp'
