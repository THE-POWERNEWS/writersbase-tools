# 正本は pooza/ginseng-style の config/rubocop.yml。ここには writersbase-tools 固有の差分だけを書く。
# ⚠ 共通に見える緩和をここに足さないこと。共通化したい場合は pooza/ginseng-style に Issue を立てる。
# ⚠ `bundle exec rubocop` で実行すること（inherit_gem は gem のパス解決に Bundler を使う）。
inherit_gem:
  ginseng-style: config/rubocop.yml

AllCops:
  # ⚠⚠ **配る既定は 3.4 だが、ここは 3.3 に下げる。** このリポジトリの CI は
  # matrix の最小 3.3（Ubuntu の system ruby）でも回る（.github/workflows/test.yml）。
  # ⚠ 実行より高い版を指すと、動かない構文を前提に lint することになる。
  # ⚠ matrix の最小を上げるときは、ここも同時に上げる。
  TargetRubyVersion: 3.3
